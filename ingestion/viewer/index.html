<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Question JSON Viewer</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --panel-soft: #f0f4f8;
      --text: #17202a;
      --muted: #637083;
      --line: #d8e0ea;
      --accent: #0f766e;
      --accent-soft: #d9f3ef;
      --warn: #9a3412;
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      line-height: 1.5;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 2;
      border-bottom: 1px solid var(--line);
      background: rgba(246, 247, 249, 0.96);
      backdrop-filter: blur(10px);
    }

    .bar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: center;
      max-width: 1180px;
      margin: 0 auto;
      padding: 14px 20px;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }

    .status {
      color: var(--muted);
      font-size: 13px;
      text-align: right;
    }

    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 16px 20px 40px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(220px, 1.6fr) repeat(6, minmax(120px, 1fr)) 170px auto;
      gap: 10px;
      align-items: center;
      margin-bottom: 14px;
    }

    input,
    select,
    button {
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      font: inherit;
    }

    input[type="search"] {
      width: 100%;
      padding: 0 12px;
    }

    input[type="file"] {
      max-width: 260px;
      padding: 7px;
      font-size: 13px;
    }

    select {
      padding: 0 10px;
    }

    button {
      padding: 0 12px;
      cursor: pointer;
    }

    button:hover {
      border-color: var(--accent);
      background: var(--accent);
    }

    .notice {
      display: none;
      margin-bottom: 14px;
      padding: 10px 12px;
      border: 1px solid #fed7aa;
      border-radius: var(--radius);
      background: #fff7ed;
      color: var(--warn);
      font-size: 14px;
    }

    .grid {
      display: grid;
      gap: 10px;
    }

    .question-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      overflow: hidden;
    }

    .question-head {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--panel-soft);
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      min-width: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .pill {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      padding: 2px 8px;
      white-space: nowrap;
    }

    .question-body {
      padding: 12px;
    }

    .question-text {
      margin: 0 0 10px;
      white-space: pre-wrap;
      font-weight: 650;
    }

    .options {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .option {
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 8px;
      align-items: start;
      min-height: 42px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      transition: transform 140ms ease, border-color 140ms ease, box-shadow 140ms ease, background-color 140ms ease;
    }

    .option:hover {
      transform: translateY(-1px);
      border-color: rgba(15, 118, 110, 0.38);
      box-shadow: 0 8px 18px rgba(15, 118, 110, 0.08);
      background: #4be15f;
    }

    .option-label {
      display: inline-grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 800;
    }

    .option-text {
      min-width: 0;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .empty {
      padding: 28px;
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 820px) {

      .bar,
      .toolbar {
        grid-template-columns: 1fr;
      }

      .status {
        text-align: left;
      }

      .options {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="bar">
      <h1>Question JSON Viewer</h1>
      <div class="status" id="status">Loading parsed/questions.json...</div>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <input id="search" type="search" placeholder="Search question, option, ID, or page" />
      <select id="paperFilter" aria-label="Filter by paper">
        <option value="">All papers</option>
      </select>
      <select id="yearFilter" aria-label="Filter by year">
        <option value="">All years</option>
      </select>
      <select id="subjectFilter" aria-label="Filter by subject">
        <option value="">All subjects</option>
      </select>
      <select id="shiftFilter" aria-label="Filter by shift">
        <option value="">All shifts</option>
      </select>
      <select id="languageFilter" aria-label="Filter by language">
        <option value="">All languages</option>
      </select>
      <select id="pageFilter" aria-label="Filter by page">
        <option value="">All pages</option>
      </select>
      <select id="issueFilter" aria-label="Filter by render issue">
        <option value="">All questions</option>
        <option value="markers">Suspicious markers</option>
        <option value="long">Long text</option>
      </select>
      <input id="filePicker" type="file" accept="application/json,.json" />
    </div>

    <div class="notice" id="notice"></div>
    <div class="grid" id="questions"></div>
  </main>

  <script>
    const state = {
      questions: [],
      search: "",
      paper: "",
      year: "",
      subject: "",
      shift: "",
      language: "",
      page: "",
      issue: "",
    };

    const els = {
      status: document.getElementById("status"),
      search: document.getElementById("search"),
      paperFilter: document.getElementById("paperFilter"),
      yearFilter: document.getElementById("yearFilter"),
      subjectFilter: document.getElementById("subjectFilter"),
      shiftFilter: document.getElementById("shiftFilter"),
      languageFilter: document.getElementById("languageFilter"),
      pageFilter: document.getElementById("pageFilter"),
      issueFilter: document.getElementById("issueFilter"),
      filePicker: document.getElementById("filePicker"),
      notice: document.getElementById("notice"),
      questions: document.getElementById("questions"),
    };

    const suspiciousMarkers = ["\uFFFD", "\u00C2", "\u00E2\u20AC", "\u00E2\u20AC\u00A6", "<br", "</", "&nbsp;"];

    function text(value) {
      return String(value ?? "");
    }

    function paperOf(question) {
      return question.paper && typeof question.paper === "object" ? question.paper : {};
    }

    function normalizeQuestions(data) {
      const items = [];

      const pushQuestion = (question, paper) => {
        if (!question || typeof question !== "object") return;
        items.push({
          ...question,
          source: question.source && typeof question.source === "object" ? { ...question.source } : {},
          paper: question.paper && typeof question.paper === "object" ? { ...question.paper } : (paper ? { ...paper } : null),
        });
      };

      if (Array.isArray(data)) {
        for (const item of data) {
          if (item && typeof item === "object" && Array.isArray(item.questions)) {
            for (const question of item.questions) {
              pushQuestion(question, item.paper && typeof item.paper === "object" ? item.paper : null);
            }
          } else {
            pushQuestion(item, null);
          }
        }
        return items;
      }

      if (data && typeof data === "object" && Array.isArray(data.questions)) {
        for (const question of data.questions) {
          pushQuestion(question, data.paper && typeof data.paper === "object" ? data.paper : null);
        }
        return items;
      }

      throw new Error("JSON root must be a questions array or a paper/questions object.");
    }

    function paperLabel(question) {
      const paper = paperOf(question);
      const parts = [paper.paper, paper.subject, paper.year, paper.shift, paper.language].filter(Boolean);
      return parts.join(" • ");
    }

    function paperKey(question) {
      const paper = paperOf(question);
      return text(paperLabel(question) || paper.file);
    }

    function paperField(question, field) {
      const paper = paperOf(question);
      return paper[field];
    }

    function distinctValues(values) {
      return [...new Set(values.filter((value) => value !== undefined && value !== null && value !== ""))];
    }

    function sortText(values) {
      return values.slice().sort((left, right) => text(left).localeCompare(text(right), undefined, { numeric: true, sensitivity: "base" }));
    }

    function populateSelect(select, values, formatter = (value) => value) {
      const currentValue = select.value;
      const options = ['<option value="">' + select.querySelector("option")?.textContent + "</option>"];
      for (const value of sortText(distinctValues(values))) {
        options.push(`<option value="${escapeHtml(value)}">${escapeHtml(formatter(value))}</option>`);
      }
      select.innerHTML = options.join("");
      select.value = currentValue;
    }

    function escapeHtml(value) {
      return text(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function hasSuspiciousMarker(question) {
      const values = [question.question, ...Object.values(question.options || {})].map(text);
      return values.some((value) => suspiciousMarkers.some((marker) => value.includes(marker)));
    }

    function hasLongText(question) {
      return text(question.question).length > 380 || Object.values(question.options || {}).some((value) => text(value).length > 160);
    }

    function setNotice(message) {
      els.notice.style.display = message ? "block" : "none";
      els.notice.textContent = message || "";
    }

    function updatePageFilter() {
      const pages = [...new Set(state.questions.map((q) => q.source?.page).filter(Boolean))].sort((a, b) => a - b);
      populateSelect(els.pageFilter, pages, (page) => `Page ${page}`);
    }

    function updateMetadataFilters() {
      populateSelect(els.paperFilter, state.questions.map((question) => paperKey(question)));
      populateSelect(els.yearFilter, state.questions.map((question) => paperField(question, "year")));
      populateSelect(els.subjectFilter, state.questions.map((question) => paperField(question, "subject")));
      populateSelect(els.shiftFilter, state.questions.map((question) => paperField(question, "shift")));
      populateSelect(els.languageFilter, state.questions.map((question) => paperField(question, "language")));
    }

    function matchesSearch(question) {
      if (!state.search) return true;
      const haystack = [
        paperKey(question),
        question.paper?.file,
        question.source?.page,
        question.source?.question_number,
        question.source?.source_question_id,
        question.question,
        ...Object.values(question.options || {}),
      ].join(" ").toLowerCase();
      return haystack.includes(state.search.toLowerCase());
    }

    function filteredQuestions() {
      return state.questions.filter((question) => {
        if (state.paper && paperKey(question) !== state.paper) return false;
        if (state.year && text(paperField(question, "year")) !== state.year) return false;
        if (state.subject && text(paperField(question, "subject")) !== state.subject) return false;
        if (state.shift && text(paperField(question, "shift")) !== state.shift) return false;
        if (state.language && text(paperField(question, "language")) !== state.language) return false;
        if (state.page && String(question.source?.page) !== state.page) return false;
        if (state.issue === "markers" && !hasSuspiciousMarker(question)) return false;
        if (state.issue === "long" && !hasLongText(question)) return false;
        return matchesSearch(question);
      });
    }

    function render() {
      const questions = filteredQuestions();
      els.status.textContent = `${questions.length} shown / ${state.questions.length} total`;

      if (!questions.length) {
        els.questions.innerHTML = '<div class="empty">No questions match the current filters.</div>';
        return;
      }

      els.questions.innerHTML = questions
        .map((question) => {
          const source = question.source || {};
          const options = question.options || {};
          const markers = hasSuspiciousMarker(question) ? '<span class="pill">marker</span>' : "";
          const optionHtml = ["A", "B", "C", "D"]
            .map(
              (label) => `
                  <div class="option">
                    <span class="option-label">${label}</span>
                    <span class="option-text">${escapeHtml(options[label])}</span>
                  </div>
                `
            )
            .join("");

          return `
              <article class="question-card">
                <div class="question-head">
                  <div class="meta">
                    <span class="pill">Q.${escapeHtml(source.question_number)}</span>
                    <span class="pill">Page ${escapeHtml(source.page)}</span>
                    <span class="pill">ID ${escapeHtml(source.source_question_id)}</span>
                    ${markers}
                  </div>
                </div>
                <div class="question-body">
                  <p class="question-text">${escapeHtml(question.question)}</p>
                  <div class="options">${optionHtml}</div>
                </div>
              </article>
            `;
        })
        .join("");
    }

    function loadQuestions(data, label) {
      state.questions = normalizeQuestions(data);
      updateMetadataFilters();
      updatePageFilter();
      setNotice("");
      render();
      els.status.textContent = `${state.questions.length} loaded from ${label}`;
    }

    async function boot() {
      try {
        const response = await fetch("../parsed/questions.json", { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        loadQuestions(await response.json(), "parsed/questions.json");
      } catch (error) {
        setNotice("Could not auto-load ../parsed/questions.json. Use the file picker to select parsed/questions.json, or open this viewer through the local Node server.");
        els.status.textContent = "Waiting for JSON file";
      }
    }

    els.search.addEventListener("input", (event) => {
      state.search = event.target.value;
      render();
    });

    els.paperFilter.addEventListener("change", (event) => {
      state.paper = event.target.value;
      render();
    });

    els.yearFilter.addEventListener("change", (event) => {
      state.year = event.target.value;
      render();
    });

    els.subjectFilter.addEventListener("change", (event) => {
      state.subject = event.target.value;
      render();
    });

    els.shiftFilter.addEventListener("change", (event) => {
      state.shift = event.target.value;
      render();
    });

    els.languageFilter.addEventListener("change", (event) => {
      state.language = event.target.value;
      render();
    });

    els.pageFilter.addEventListener("change", (event) => {
      state.page = event.target.value;
      render();
    });

    els.issueFilter.addEventListener("change", (event) => {
      state.issue = event.target.value;
      render();
    });

    els.filePicker.addEventListener("change", async (event) => {
      const file = event.target.files?.[0];
      if (!file) return;
      try {
        loadQuestions(JSON.parse(await file.text()), file.name);
      } catch (error) {
        setNotice(`Could not load selected JSON: ${error.message}`);
      }
    });

    boot();
  </script>
</body>

</html>
